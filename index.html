const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const PROG_TZ='Africa/Johannesburg';
const saFmt=(()=>{try{return new Intl.DateTimeFormat('en-GB',{timeZone:PROG_TZ,year:'numeric',month:'2-digit',day:'2-digit'})}catch(e){return null}})();
function realToday(){try{const p=Object.fromEntries(saFmt.formatToParts(new Date()).map(x=>[x.type,x.value]));return p.year+'-'+p.month+'-'+p.day}catch(e){return fmt(new Date())}}
function ctx(){
 const todayStr=mem.sample?SAMPLE_DAY:realToday();
 const t=pd(todayStr),diff=Math.round((t-pd(START))/864e5);
 const day=diff+1,before=day<1,after=day>TOTAL;
 const completed=before?0:Math.min(diff,TOTAL);
 const remaining=TOTAL-completed;
 const cd=Math.min(Math.max(day,1),TOTAL);
 const phase=cd<=14?1:cd<=28?2:3,week=Math.ceil(cd/7);
 const prog=[1,2,3].map(phPct);
 return{todayStr,t,day,before,after,completed,remaining,cd,phase,week,prog,overall:Math.round(prog.reduce((a,b)=>a+b,0)/3)};
}

function openGoal(id){

 const o=(a,s)=>a.map(x=>`<option value="${x[0]}" ${x[0]===s?'selected':''}>${x[1]}</option>`).join('');
 $('dlg').className='dlg wide';
 $('dlg').innerHTML=`<h2 id="dt" style="font:600 22px var(--serif);margin-bottom:12px">${g?'Edit goal':'New goal'}</h2>
 <div class="f"><label for="gf_t">Goal title</label><input id="gf_t" value="${esc(v.title)}" placeholder="e.g. Finish what I start"></div>
 <div class="f"><label>Type of goal</label><div class="seg"><label><input type="radio" name="gf_s" value="sprint" ${v.scope==='sprint'?'checked':''}><span>42-day goal</span></label><label><input type="radio" name="gf_s" value="life" ${v.scope==='life'?'checked':''}><span>Life goal</span></label></div><small>42-day goals finish by 20 December 2026. Life goals can run longer.</small></div>
 <div class="row2"><div class="f"><label for="gf_c">Category</label><select id="gf_c">${o(CATS,v.cat)}</select></div><div class="f"><label for="gf_pr">Priority</label><select id="gf_pr">${o(Object.entries(PRI),v.pri)}</select></div></div>
 <div class="f"><label for="gf_d">Target completion date</label><input type="date" id="gf_d" value="${v.due}"></div>
 <div class="f"><label for="gf_o">Desired outcome</label><input id="gf_o" value="${esc(v.outcome)}" placeholder="What will be true when you’re done?"></div>
 <div class="f"><label for="gf_i">Measurable success indicator</label><input id="gf_i" value="${esc(v.ind)}" placeholder="A number or yes/no check, e.g. 5 finished tasks a week"></div>
 <details ${g?'open':''}><summary>More detail (optional)</summary>
 <div class="f"><label for="gf_de">Description</label><textarea id="gf_de">${esc(v.desc)}</textarea></div>
 <div class="f"><label for="gf_w">Why this goal matters to me</label><textarea id="gf_w">${esc(v.why)}</textarea></div>
 <div class="f"><label for="gf_f">Starting position</label><input id="gf_f" value="${esc(v.from)}" placeholder="Where are you today?"></div>
 <div class="f"><label for="gf_m">Weekly milestones</label><textarea id="gf_m" placeholder="One per line. The first line is Week 1.">${esc(v.miles.map(m=>m.t).join('\n'))}</textarea></div>
 <div class="f"><label for="gf_a">Daily actions</label><textarea id="gf_a" placeholder="One per line. Keep each small.">${esc(v.acts.join('\n'))}</textarea></div>
 <div class="f"><label for="gf_p">Current progress (%)</label><input type="number" id="gf_p" min="0" max="100" value="${v.prog}"></div></details>
 <div class="smart" id="smart"></div><p class="err" id="gerr" role="alert"></p>
 <div class="actions" style="justify-content:flex-end"><button class="btn alt" id="cx">Cancel</button><button class="btn" id="gsv">Save goal</button></div>`;
 $('ov').classList.add('on');$('gf_t').focus();smart();$('dlg').oninput=smart;$('cx').onclick=closeRec;
 $('gsv').onclick=()=>{
  const val=i=>$(i).value.trim(),lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean),err=m=>{$('gerr').textContent=m};
  const sc=document.querySelector('[name=gf_s]:checked').value,due=$('gf_d').value,t=val('gf_t');
  if(!t)return err('Give your goal a title.');
  if(!due)return err('Choose a target date.');
  if((!g||g.due!==due)&&due<c.todayStr)return err('Choose a target date from today onwards.');
  if(sc==='sprint'&&due>END)return err('A 42-day goal must finish by 20 December 2026. Pick an earlier date or choose Life goal.');
  const old=g?g.miles:[],prog=Math.min(100,Math.max(0,+$('gf_p').value||0));
  const n={title:t,scope:sc,cat:$('gf_c').value,pri:$('gf_pr').value,due,outcome:val('gf_o'),ind:val('gf_i'),desc:val('gf_de'),why:val('gf_w'),from:val('gf_f'),acts:lines($('gf_a').value),prog,miles:lines($('gf_m').value).map((x,i)=>({t:x,done:old[i]?old[i].done:false}))};
  if(g){const ch=g.prog!==prog;Object.assign(g,n);if(ch){g.wk=g.wk||{};g.wk[c.week]=prog}}
  else mem.goals.push(Object.assign({id:gid(),start:c.todayStr,p0:prog,wk:{},done:false},n));
  save();closeRec();G.view='active';render(1);toast(g?'Goal updated':'Goal created');
 };
}
function confirmDel(id,type){
 const l=type==='goal'?mem.goals:mem.reasons,x=l.find(i=>i.id===id);if(!x)return;
 $('dlg').className='dlg';
 $('dlg').innerHTML=`<h2 id="dt" style="font:600 22px var(--serif)">Delete this ${type}?</h2><p>“${esc(x.title||x.t)}” will be removed permanently. This can’t be undone.</p><div class="actions" style="justify-content:flex-end"><button class="btn alt" id="cx">Keep ${type}</button><button class="btn danger" id="cdel">Delete ${type}</button></div>`;
 $('ov').classList.add('on');$('cx').focus();$('cx').onclick=closeRec;
 $('cdel').onclick=()=>{if(type==='goal')mem.goals=mem.goals.filter(i=>i.id!==id);else mem.reasons=mem.reasons.filter(i=>i.id!==id);save();closeRec();render(1);toast(type==='goal'?'Goal deleted':'Reason deleted')};
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.gv){G.view=d.gv;render(1)}
 else if(d.gs){G.scope=d.gs;render(1)}
 else if(d.gnew!==undefined)openGoal();
 else if(d.gedit)openGoal(d.gedit);
 else if(d.gdel)confirmDel(d.gdel,'goal');
 else if(d.rdel)confirmDel(d.rdel,'reason');
 else if(d.gdone){const g=mem.goals.find(x=>x.id===d.gdone),c=ctx();if(g){if(g.done){g.done=false;delete g.completedOn}else{g.done=true;g.prog=100;g.completedOn=c.todayStr;g.wk=g.wk||{};g.wk[c.week]=100}save();render(1);toast(g.done?'Goal marked complete':'Goal reopened')}}
 else if(b.id==='radd'){const t=$('rtext').value.trim();if(!t){toast('Write a reason first');return}mem.reasons.push({id:gid(),t,d:ctx().todayStr});save();render(1);toast('Reason saved')}
});
document.addEventListener('change',e=>{
 const d=e.target.dataset,c=ctx();
 if(d.gp){const g=mem.goals.find(x=>x.id===d.gp);if(g){g.prog=+e.target.value;g.wk=g.wk||{};g.wk[c.week]=g.prog;save();render(1)}}
 else if(d.gm){const[i,k]=d.gm.split(':'),g=mem.goals.find(x=>x.id===i);if(g){g.miles[+k].done=e.target.checked;save();render(1)}}
 else if(d.gcat!==undefined){G.cat=e.target.value;render(1)}
});

const SAMPLE_PH={1:{read:[1,2],ex:[1,2],wk:[1],obj:[0]},2:{read:[1],ex:[1],wk:[1],obj:[]},3:{read:[1],ex:[1],wk:[1],obj:[]}};
function pst(p){mem.ph=mem.ph||{};return mem.ph[p]=mem.ph[p]||{read:{},ex:{},wk:{},obj:{},refl:{},notes:''}}
function pv(p,k,i){const v=pst(p)[k][i];return v!==undefined?v:!!(mem.sample&&SAMPLE_PH[p][k].includes(+i))}
function phStats(p){const s=pst(p),R=[1,2,3,4,5,6],O=[0,1,2,3,4],cnt=(k,a)=>a.filter(i=>pv(p,k,i)).length;
 const parts=[['Reading assignments',cnt('read',R),6],['Practical exercises',cnt('ex',R),6],['Weekly objectives',cnt('wk',R),6],['Phase objectives achieved',cnt('obj',O),5],['Reflections written',R.filter(i=>(s.refl[i]||'').trim()).length,6]];
 return{parts,pct:Math.round(parts.reduce((a,x)=>a+x[1],0)/29*100)}}
const phPct=p=>phStats(p).pct;
const stt=p=>p>=100?'Complete':p>0?'In progress':'Not started';

const RS={view:'books',nb:'all',nt:'all',fb:'b1',ft:'lessons'};
const BOOKS=[['b1','Psycho-Cybernetics','Maxwell Maltz','Mental reprogramming','main'],['b2','Mindset','Carol Dweck','Mental reprogramming','main'],['b3','Man’s Search for Meaning','Viktor Frankl','Identity development','main'],['b4','Meditations','Marcus Aurelius','Identity development','main'],['b5','Atomic Habits','James Clear','Behavioural transformation','main'],['b6','The Power of Habit','Charles Duhigg','Behavioural transformation','sup'],['b7','Deep Work','Cal Newport','Productivity and focus','sup'],['b8','The 7 Habits of Highly Effective People','Stephen Covey','Personal effectiveness','sup'],['b9','Wherever You Go, There You Are','Jon Kabat-Zinn','Mindfulness','sup'],['b10','The Psychology of Money','Morgan Housel','Money and mindset','sup']];

function rb(id){mem.rd=mem.rd||{};const d=mem.rd[id]||{},B=BOOKS.find(b=>b[0]===id);return{id,title:B[1],author:B[2],cat:d.cat||B[3],role:d.role||B[4],total:+d.total||0,sp:+d.sp||1,cur:+d.cur||0,chd:+d.chd||0,cht:+d.cht||0,start:d.start||'',target:d.target||'',status:d.status||''}}
function setb(id,p){mem.rd=mem.rd||{};mem.rd[id]=Object.assign(mem.rd[id]||{},p);save()}
function rcalc(b,c){
 const range=b.total?b.total-b.sp+1:0,read=Math.max(0,(b.total?Math.min(b.cur,b.total):b.cur)-(b.sp-1)),pct=range>0?Math.min(100,Math.round(read/range*100)):null;
 let st=b.status;if(!st)st=b.total&&b.cur>=b.total?'Completed':read>0?'Reading':b.role==='sup'?'Future reading':'Not started';
 const dl=b.target?Math.round((pd(b.target)-c.t)/864e5):null,perDay=range&&dl!==null&&dl>0&&st!=='Completed'&&read<range?Math.ceil((range-read)/dl):null;
 return{range,read,pct,st,dl,perDay,late:dl!==null&&dl<0&&st!=='Completed'};
}

 <div class="mini"><div><small>Pages read</small>${x.read}${x.range?' of '+x.range:''}</div><div><small>Chapters</small>${b.chd}${b.cht?' of '+b.cht:''}</div><div><small>Started</small>${b.start?fd(b.start):'Not set'}</div><div><small>Target</small>${b.target?fd(b.target):'Not set'}</div>${x.perDay?`<div><small>To finish on time</small>${x.perDay} pages/day</div>`:''}</div>
 <div class="qrow"><label>Current page<input type="number" min="0" data-rc="${b.id}" value="${b.cur||''}" placeholder="0"></label><label>Chapters done<input type="number" min="0" data-rch="${b.id}" value="${b.chd||''}" placeholder="0"></label><button class="btn alt sm" data-eb="${b.id}">Edit details</button><button class="btn alt sm" data-bn="${b.id}">Notes (${nn})</button></div></article>`;
}
function readingPage(){

function habitOverall(h,c){
 const L=hlog(h.id),hs=hstart(h),t=capT(c),n=FREQ[h.freq][1];let done=0,exp=0;
 if(h.freq==='daily'||h.freq==='weekdays'){for(let d=hs;d<=t;d=addDays(d,1)){if(h.freq==='weekdays'&&dowOf(d)>4)continue;if(d===t&&!L[d])continue;exp++;if(L[d])done++}}
 else{for(let m=addDays(hs,-dowOf(hs));addDays(m,6)<t;m=addDays(m,7)){let k=0;for(let i=0;i<7;i++)if(L[addDays(m,i)])k++;exp+=n;done+=Math.min(k,n)}}

}

function mdHtml(s){
 const inl=t=>t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g,'$1<em>$2</em>');
 const out=[];let ul=false;
 esc(s).split('\n').forEach(l=>{let m;
  if(m=l.match(/^(#{1,3})\s+(.*)$/)){if(ul){out.push('</ul>');ul=false}const h=m[1].length+2;out.push(`<h${h}>${inl(m[2])}</h${h}>`)}
  else if(m=l.match(/^[-*]\s+(.*)$/)){if(!ul){out.push('<ul>');ul=true}out.push(`<li>${inl(m[1])}</li>`)}
  else{if(ul){out.push('</ul>');ul=false}if(l.trim())out.push(`<p>${inl(l)}</p>`)}});
 if(ul)out.push('</ul>');return out.join('');
}
function jStats(){

function jSave(draft){
 const f=jForm(),err=m=>{$('jerr').textContent=m},body=f.body.trim();
 if(!f.date)return err('Choose a date.');

function dayTasks(c){
 const today=c.todayStr;
 if(mem.sample)return TASKS.map(t=>({id:t[0],label:t[1],sub:t[2],tag:t[3],done:!!(mem.done[today]||{})[t[0]],kind:'static'}));
 if(c.before||c.after)return [];
 const out=[],dow=dowOf(today);
 hh().forEach(h=>{if(h.freq==='weekdays'&&dow>4)return;out.push({id:'h:'+h.id,label:h.name,sub:FREQ[h.freq][0]+(h.dur?' · '+h.dur+' min':''),tag:'Habit',done:!!hlog(h.id)[today],kind:'habit'})});
 const P=PHASES[c.phase-1],w=c.week,r=P.w[w-1][1].split('|'),ex=exAll().find(e=>e.built&&e.p===P.id&&e.w===w);
 out.push({id:'r:'+P.id+':'+w,label:'Read: '+r[0]+', '+r[1],sub:'Phase '+P.id+' reading for week '+w,tag:'Reading',done:pst(P.id).read[w]===true,kind:'read'});
 if(ex)out.push({id:'x:'+ex.id,label:'Exercise: '+ex.title,sub:'Phase '+P.id+' exercise for week '+w,tag:'Exercise',done:xReal(ex),kind:'ex'});
 out.push({id:'j',label:'Write in your journal',sub:'Ticks itself when you save a completed entry today',tag:'Journal',done:mem.jn.some(e=>!e.draft&&e.date===today),kind:'journal'});
 return out;
}

 else if(id.indexOf('r:')===0){const a=id.split(':');pst(+a[1]).read[a[2]]=on}
 else if(id.indexOf('x:')===0){const e=exAll().find(x=>x.id===id.slice(2));if(e)xSet(e,on,c)}
 else if(id!=='j'){mem.done[c.todayStr]=mem.done[c.todayStr]||{};if(on)mem.done[c.todayStr][id]=1;else delete mem.done[c.todayStr][id]}
}

 else if(c.before){const d=1-c.day;body=`<p style="margin:0 0 8px">Your 42 days start on Monday 9 November, in ${d} day${d===1?'':'s'}. Tasks appear here from Day 1.</p><p class="sub" style="margin:0;font-size:14px">Until then you can <a href="#habits">add habits</a>, <a href="#goals">set goals</a> and <a href="#reading">enter your book details</a>.</p>`}

 return `<section class="card"><h2>Today’s tasks${live&&T.length?` <span class="chip">${n} of ${T.length} done</span>`:''}</h2>${body}</section>`;
}
